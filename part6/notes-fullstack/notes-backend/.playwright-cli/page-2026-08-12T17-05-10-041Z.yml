              - button "copy" [ref=e204] [cursor=pointer]
            - paragraph [ref=e205]:
              - text: Before we move on, let's break the tests one more time. We notice that the execution of the tests is quite fast when they pass, but much slower if the they do not pass. The reason for this is that Playwright's policy is to wait for searched elements until
              - link "they are rendered and ready for action" [ref=e206] [cursor=pointer]:
                - /url: https://playwright.dev/docs/actionability
              - text: . If the element is not found, a
              - emphasis [ref=e207]: TimeoutError
              - text: is raised and the test fails. Playwright waits for elements by default for 5 or 30 seconds
              - link "depending on the functions used in testing" [ref=e208] [cursor=pointer]:
                - /url: https://playwright.dev/docs/test-timeouts#introduction
              - text: .
            - paragraph [ref=e209]:
              - text: When developing tests, it may be wiser to reduce the waiting time to a few seconds. According to the
              - link "documentation" [ref=e210] [cursor=pointer]:
                - /url: https://playwright.dev/docs/test-timeouts
              - text: ", this can be done by changing the file"
