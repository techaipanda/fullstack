            - paragraph [ref=e185]: The second check is done without using the auxiliary variable.
            - paragraph [ref=e186]: "The test fails because an old year ended up in the test. Playwright opens the test report in the browser and it becomes clear that Playwright has actually performed the tests with three different browsers: Chrome, Firefox and Webkit, i.e. the browser engine used by Safari:"
            - img "test report showing the test failing in three different browsers" [ref=e188]
            - paragraph [ref=e189]: "By clicking on the report of one of the browsers, we can see a more detailed error message:"
            - img "test error message" [ref=e191]
            - paragraph [ref=e192]: "In the big picture, it is of course a very good thing that the testing takes place with all three commonly used browser engines, but this is slow, and when developing the tests it is probably best to carry them out mainly with only one browser. You can define the browser engine to be used with the command line parameter:"
            - generic [ref=e194]:
