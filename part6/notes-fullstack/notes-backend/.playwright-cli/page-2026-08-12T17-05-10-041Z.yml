              - code [ref=e150]: npm run test -- --ui
              - button "copy" [ref=e151] [cursor=pointer]
            - paragraph [ref=e152]: "Sample tests in the file tests/example.spec.js look like this:"
            - generic [ref=e154]:
              - code [ref=e155]:
                - text: "// @ts-check import { test, expect } from '@playwright/test'; test('has title', async ("
