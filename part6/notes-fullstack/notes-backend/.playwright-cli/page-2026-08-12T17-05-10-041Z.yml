                - text: ") => { await page.goto('https://playwright.dev/'); // Click the get started link. await page.getByRole('link', { name: 'Get started' }).click(); // Expects page to have a heading with the name of Installation. await expect(page.getByRole('heading', { name: 'Installation' })).toBeVisible(); });"
              - button "copy" [ref=e160] [cursor=pointer]
            - paragraph [ref=e161]:
              - text: The first line of the test functions says that the tests are testing the page at
              - link "https://playwright.dev/" [ref=e162] [cursor=pointer]:
                - /url: https://playwright.dev/
              - text: .
            - heading "Testing our own code" [level=3] [ref=e163]
            - paragraph [ref=e164]: Now let's remove the sample tests and start testing our own application.
            - paragraph [ref=e165]: Playwright tests assume that the system under test is running when the tests are executed. Unlike, for example, backend integration tests, Playwright tests do not start the system under test during testing.
            - paragraph [ref=e166]: Let's make an npm script for the backend, which will enable it to be started in testing mode, i.e. so that NODE_ENV gets the value test.
            - generic [ref=e168]:
              - code [ref=e169]:
                - text: "{ // ... \"scripts\": { \"start\": \"cross-env NODE_ENV=production node index.js\", \"dev\": \"cross-env NODE_ENV=development node --watch index.js\", \"test\": \"cross-env NODE_ENV=test node --test\", \"lint\": \"eslint .\", // ..."
                - generic [ref=e170]: "\"start:test\": \"cross-env NODE_ENV=test node --watch index.js\""
                - text: "}, // ... }"
              - button "copy" [ref=e171] [cursor=pointer]
            - paragraph [ref=e172]:
              - text: Let's start the frontend and backend, and create the first test file for the application
