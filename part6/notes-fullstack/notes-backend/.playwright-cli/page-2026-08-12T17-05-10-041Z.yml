            - heading "End to end testing" [level=1] [ref=e72]
          - generic [ref=e74]:
            - paragraph [ref=e75]: So far we have tested the backend as a whole on an API level using integration tests and tested some frontend components using unit tests.
            - paragraph [ref=e76]:
              - text: Next, we will look into one way to test the
              - link "system as a whole" [ref=e77] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/System_testing
              - text: using End to End (E2E) tests.
            - paragraph [ref=e78]:
              - text: We can do E2E testing of a web application using a browser and a testing library. There are multiple libraries available. One example is
              - link "Selenium" [ref=e79] [cursor=pointer]:
                - /url: http://www.seleniumhq.org/
              - text: ", which can be used with almost any browser. Another browser option is so-called"
              - link "headless browsers" [ref=e80] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Headless_browser
              - text: ", which are browsers with no graphical user interface. For example, Chrome can be used in headless mode."
            - paragraph [ref=e81]: E2E tests are potentially the most useful category of tests because they test the system through the same interface as real users use.
            - paragraph [ref=e82]:
              - text: They do have some drawbacks too. Configuring E2E tests is more challenging than unit or integration tests. They also tend to be quite slow, and with a large system, their execution time can be minutes or even hours. This is bad for development because during coding it is beneficial to be able to run tests as often as possible in case of code
              - link "regressions" [ref=e83] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Regression_testing
              - text: .
            - paragraph [ref=e84]:
              - text: E2E tests can also be
              - link "flaky" [ref=e85] [cursor=pointer]:
                - /url: https://hackernoon.com/flaky-tests-a-war-that-never-ends-9aa32fdef359
              - text: . Some tests might pass one time and fail another, even if the code does not change at all.
            - paragraph [ref=e86]:
              - text: Perhaps the two easiest libraries for End to End testing at the moment are
              - link "Playwright" [ref=e87] [cursor=pointer]:
                - /url: https://playwright.dev/
              - text: and
              - link "Cypress" [ref=e88] [cursor=pointer]:
                - /url: https://www.cypress.io/
              - text: .
            - paragraph [ref=e89]:
              - text: From the statistics on
              - link "npmtrends.com" [ref=e90] [cursor=pointer]:
                - /url: https://npmtrends.com/cypress-vs-playwright
              - text: "we can see that Playwright surpassed Cypress in download numbers during 2024, and its popularity continues to grow:"
            - img "cypress vs playwright in npm trends" [ref=e92]
            - paragraph [ref=e93]: This course has been using Cypress for years. Now our choice is Playwright.
            - paragraph [ref=e94]:
              - text: So
              - link "Playwright" [ref=e95] [cursor=pointer]:
                - /url: https://playwright.dev/
              - text: is a newcomer to the End to End tests, which started to explode in popularity towards the end of 2023. Playwright is roughly on a par with Cypress in terms of ease of use. The libraries are slightly different in terms of how they work. Cypress is radically different from most libraries suitable for E2E testing, as Cypress tests are run entirely within the browser. Playwright's tests, on the other hand, are executed in the Node process, which is connected to the browser via programming interfaces.
            - paragraph [ref=e96]: Now let's explore Playwright.
            - heading "Initializing tests" [level=3] [ref=e97]
            - paragraph [ref=e98]:
              - text: Unlike the backend tests or unit tests done on the React front-end, End to End tests do not need to be located in the same npm project where the code is. Let's make a completely separate project for the E2E tests with the
              - emphasis [ref=e99]: npm init
              - text: "command. Then install Playwright by running in the new project directory the command:"
            - generic [ref=e101]:
              - code [ref=e102]: npm init playwright@latest
              - button "copy" [ref=e103] [cursor=pointer]
            - paragraph [ref=e104]: "The installation script will ask a few questions, answer them as follows:"
            - 'img "answer: javascript, tests, false, true" [ref=e106]'
            - paragraph [ref=e107]: "Note that when installing Playwright your operating system may not support all of the browsers Playwright offers and you may see an error message like below:"
            - generic [ref=e109]:
              - code [ref=e110]: "Webkit 18.0 (playwright build v2070) downloaded to /home/user/.cache/ms-playwright/webkit-2070 Playwright Host validation warning: ╔══════════════════════════════════════════════════════╗ ║ Host system is missing dependencies to run browsers. ║ ║ Missing libraries: ║ ║ libicudata.so.66 ║ ║ libicui18n.so.66 ║ ║ libicuuc.so.66 ║ ║ libjpeg.so.8 ║ ║ libwebp.so.6 ║ ║ libpcre.so.3 ║ ║ libffi.so.7 ║ ╚══════════════════════════════════════════════════════╝"
              - button "copy" [ref=e111] [cursor=pointer]
            - paragraph [ref=e112]:
              - text: If this is the case you can either specify specific browsers to test with
              - code [ref=e113]: "--project="
              - text: in your
              - emphasis [ref=e114]: package.json
              - text: ":"
            - generic [ref=e116]:
              - code [ref=e117]: "\"test\": \"playwright test --project=chromium --project=firefox\","
              - button "copy" [ref=e118] [cursor=pointer]
            - paragraph [ref=e119]:
              - text: or remove the entry for any problematic browsers from your
              - emphasis [ref=e120]: playwright.config.js
              - text: "file:"
            - generic [ref=e122]:
              - code [ref=e123]: "projects: [ // ... //{ // name: 'webkit', // use: { ...devices['Desktop Safari'] }, //}, // ... ]"
              - button "copy" [ref=e124] [cursor=pointer]
            - paragraph [ref=e125]:
              - text: Let's define an npm script for running tests and test reports in
              - emphasis [ref=e126]: package.json
              - text: ":"
            - generic [ref=e128]:
              - code [ref=e129]: "{ // ... \"scripts\": { \"test\": \"playwright test\", \"test:report\": \"playwright show-report\" }, // ... }"
              - button "copy" [ref=e130] [cursor=pointer]
            - paragraph [ref=e131]: "During installation, the following is printed to the console:"
            - generic [ref=e133]:
              - code [ref=e134]: "And check out the following files: - ./tests/example.spec.js - Example end-to-end test - ./tests-examples/demo-todo-app.spec.js - Demo Todo App end-to-end tests - ./playwright.config.js - Playwright Test configuration"
              - button "copy" [ref=e135] [cursor=pointer]
            - paragraph [ref=e136]: that is, the location of a few example tests for the project that the installation has created.
            - paragraph [ref=e137]: "Let's run the tests:"
            - generic [ref=e139]:
              - code [ref=e140]: "$ npm test > notes-e2e@1.0.0 test > playwright test Running 6 tests using 5 workers 6 passed (3.9s) To open last HTML report run: npx playwright show-report"
              - button "copy" [ref=e141] [cursor=pointer]
            - paragraph [ref=e142]: "The tests pass. A more detailed test report can be opened either with the command suggested by the output, or with the npm script we just defined:"
            - generic [ref=e144]:
              - code [ref=e145]: npm run test:report
              - button "copy" [ref=e146] [cursor=pointer]
            - paragraph [ref=e147]: "Tests can also be run via the graphical UI with the command:"
